<style>
/* Layout: app shell. Sidebar nav on desktop, bottom tab bar on phones; one scrolling main column of panels. */
:root{
  --bg:#F3F7F4; --surface:#FFFFFF; --surface-2:#EAF2ED; --line:#DAE6DF;
  --ink:#0D1F19; --ink-2:#3D564E; --ink-3:#71877E;
  --accent:#0B7D5A; --accent-soft:#DCF2E8; --on-accent:#FFFFFF;
  --paid:#0F8F5E; --paid-soft:#DAF2E5; --owed:#CF4F39; --owed-soft:#FCE6E0; --warn:#B98200; --warn-soft:#FDF3D3;
  --fund:#0F7C8C; --fund-soft:#D9F0F2; --gold:#8BF2BD;
  --hero-a:#0B6B4D; --hero-b:#10916A; --hero-c:#2BB386;
  --shadow:0 1px 2px rgba(13,31,25,.05),0 8px 24px rgba(13,31,25,.06);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#07120E; --surface:#0E1C17; --surface-2:#15271F; --line:#21382E;
  --ink:#E5F2EB; --ink-2:#A1BBB0; --ink-3:#6D887C;
  --accent:#36C28C; --accent-soft:#0F3528; --on-accent:#04170E;
  --paid:#46DB9F; --paid-soft:#123A2B; --owed:#FF8B71; --owed-soft:#3E1F18; --warn:#F4C152; --warn-soft:#3A2D10;
  --fund:#4FC6D4; --fund-soft:#0F2F37; --gold:#7CF0B0;
  --hero-a:#0A5440; --hero-b:#0E7656; --hero-c:#18966B;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07120E; --surface:#0E1C17; --surface-2:#15271F; --line:#21382E;
  --ink:#E5F2EB; --ink-2:#A1BBB0; --ink-3:#6D887C;
  --accent:#36C28C; --accent-soft:#0F3528; --on-accent:#04170E;
  --paid:#46DB9F; --paid-soft:#123A2B; --owed:#FF8B71; --owed-soft:#3E1F18; --warn:#F4C152; --warn-soft:#3A2D10;
  --fund:#4FC6D4; --fund-soft:#0F2F37; --gold:#7CF0B0;
  --hero-a:#0A5440; --hero-b:#0E7656; --hero-c:#18966B;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px;font-family:var(--display);font-size:20px;font-weight:700}
.brand svg{flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav svg{width:18px;height:18px;flex:none}
.side .grow{flex:1}
.side-actions{display:flex;flex-direction:column;gap:8px}
main{min-width:0;padding-block:24px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:28px}
.topbar .sub{color:var(--ink-3);margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--owed)}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn svg{width:16px;height:16px}
.panel{background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow)}
.panel h2{font-size:17px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.muted{color:var(--ink-3)}
.label{font-size:12.5px;color:var(--ink-3);font-weight:500}
.grid{display:grid;gap:20px}
.g-hero{grid-template-columns:1.35fr 1fr}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.big{font-family:var(--display);font-size:44px;line-height:1.02;font-weight:700;letter-spacing:-.02em}
.mid{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.01em}
.stat{display:flex;flex-direction:column;gap:4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.bar>span{display:block;height:100%;border-radius:99px}
.bar.thin{height:6px}
.paid{color:var(--paid)} .owed{color:var(--owed)} .fundc{color:var(--fund)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-weight:600;font-size:12.5px;white-space:nowrap}
.pill.good{background:var(--paid-soft);color:var(--paid)}
.pill.bad{background:var(--owed-soft);color:var(--owed)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}
.pill.fund{background:var(--fund-soft);color:var(--fund)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.amt{font-weight:600;text-align:right;white-space:nowrap}
.note{padding:12px 14px;border-radius:10px;background:var(--surface-2);color:var(--ink-2)}
.note.good{background:var(--paid-soft);color:var(--ink)}
.note.example{background:var(--warn-soft);color:var(--ink);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tablewrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
td{padding:10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
tr.group td{background:var(--surface-2);font-weight:600;color:var(--ink-2);border-bottom:0;padding-top:8px;padding-bottom:8px}
tr.group td:first-child{padding-left:10px;border-radius:8px 0 0 8px}
tr.group td:last-child{border-radius:0 8px 8px 0}
.cellbtn{all:unset;cursor:pointer;padding:3px 7px;border-radius:7px;border:1px dashed transparent}
.cellbtn:hover,.cellbtn:focus-visible{border-color:var(--ink-3);background:var(--surface-2)}
.cellinput{width:96px;text-align:right;padding:4px 7px;border:1px solid var(--accent);border-radius:7px;background:var(--surface)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip small{color:var(--ink-3);font-weight:400}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:13px;color:var(--ink-2)}
.field input,.field select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0;width:100%}
.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.money-in{position:relative}
.money-in span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.money-in input{padding-left:28px}
.money-in.huge input{font-family:var(--display);font-size:30px;font-weight:700;padding:12px 14px 12px 36px}
.money-in.huge span{font-size:24px;left:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.overlay{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;overscroll-behavior:contain;touch-action:none}
.overlay .modal{overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}
body.sheet-open{position:fixed;left:0;right:0;overflow:hidden}
.modal{background:var(--surface);border-radius:16px;width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{font-size:21px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;display:flex;gap:12px;align-items:center}
.toast button{all:unset;cursor:pointer;color:var(--accent-soft);text-decoration:underline}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--body)}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink-2);font-size:13px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.kbd{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--ink-3)}
.debtcard{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,.7fr)) auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.debtcard:first-child{border-top:0}
.ring{flex:none}
.empty{text-align:center;padding:36px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty p{max-width:44ch;color:var(--ink-2);margin:0}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav strong{min-width:130px;text-align:center;font-family:var(--display);font-size:18px}
.rta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-radius:12px;flex-wrap:wrap}
.rta.good{background:var(--paid-soft)} .rta.bad{background:var(--owed-soft)} .rta.zero{background:var(--surface-2)}
.fab{display:none}
.mobile-only{display:none}
@media (max-width:760px){.mobile-only{display:inline-flex}.desk-only{display:none!important}.settings{max-width:none}.gi{padding:10px 14px;flex-wrap:wrap}.gi .gl{min-width:150px}.gi>.seg{margin-left:auto}}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
.settings{display:flex;flex-direction:column;gap:22px;max-width:720px}
.hero{background:linear-gradient(135deg,var(--hero-a),var(--hero-b) 55%,var(--hero-c));color:#fff;border:0;position:relative;overflow:hidden;padding:22px 22px 20px}
.hero-sub{color:rgba(255,255,255,.9);margin-top:4px;font-size:14.5px}
.hero-prog{margin-top:18px}.hero-prog .bar{height:10px;background:rgba(0,0,0,.18)!important}.hero-prog .bar>span{background:var(--gold)}
.hero-legend{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:13px;color:rgba(255,255,255,.92)}
.alerts{display:flex;flex-direction:column;gap:8px}
body.covered .shell{filter:blur(22px)}body.covered::after{content:"";position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 60%,transparent);z-index:90}
.checks{padding:16px 16px 8px}
.check-row{all:unset;cursor:pointer;display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%}
.check-row:first-of-type{border-top:0}
.check-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.ck-dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:#E0A100}.ck-dot.bad{background:var(--owed)}
.ck-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.ck-text span{color:var(--ink-2);font-size:13.5px}
.check-row .chev{margin-top:4px}
.alert-chip{background:var(--owed-soft)!important;color:var(--ink)!important}
.alert-chip.soft{background:var(--surface)!important;border:1px solid var(--line)}
.alert-chip.soft .ac-dot{background:var(--warn)}
.alert-chip .ac-go{color:var(--owed)!important}.alert-chip.soft .ac-go{color:var(--ink-3)!important}
.nextcard{display:flex;align-items:center;gap:14px;padding:16px}
.nc-ic{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}.nc-ic svg{width:22px;height:22px}
.nc-main{flex:1;min-width:0}.nc-t{font-weight:600;font-size:15.5px;margin:1px 0}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:inherit}
.tile{padding:16px;display:flex;flex-direction:column;gap:3px}.tile .mid{font-size:22px}
.swipe{position:relative;overflow:hidden;border-top:1px solid var(--line)}
.swipe.open .swipe-del,.swipe:has(.swipe-row[style*=translateX]) .swipe-del{opacity:1}.glist>.swipe:first-child{border-top:0}
.swipe .gi{border-top:0}
.swipe .swipe-row{background:var(--surface)!important;z-index:1}
.swipe-row{position:relative;background:var(--surface);transition:transform .18s ease;touch-action:pan-y}
.swipe-del{all:unset;cursor:pointer;position:absolute;right:0;top:1px;bottom:1px;width:94px;opacity:0;background:var(--owed);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center}
.grip{color:var(--ink-3);cursor:grab;display:flex;padding:6px 2px;touch-action:none;margin-left:-4px}
.grip:focus-visible{outline:2px solid var(--accent);border-radius:6px}
.swipe.dragging{z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.18);transition:none}
.swipe.dragging .swipe-row{background:var(--surface)}
.swipe.drop-before{box-shadow:inset 0 3px 0 var(--accent)}
.gi-del{color:var(--owed);font-weight:600;justify-content:flex-start}
@media (hover:none){.hover-only{display:none!important}}
.note.example{background:var(--accent-soft)!important}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 68%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .label{color:rgba(255,255,255,.72)}.hero .muted{color:rgba(255,255,255,.78)}
.hero .paid{color:#BFF5DA}.hero .owed{color:#FFD9A8}
.hero .bar{background:rgba(255,255,255,.18)}.hero .bar>span{background:var(--gold)!important}
.hero .stats{border-top-color:rgba(255,255,255,.18)}
.hero .btn.ghost{color:#fff}.hero .btn.ghost:hover{background:rgba(255,255,255,.12)}
.hero .nextstep{background:rgba(255,255,255,.13);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hero .nextstep .label{color:var(--gold)!important}
.hero .nextstep .btn.primary{background:#fff;color:var(--hero-a);border-color:#fff}
.hero .big{color:#fff}
.spark-wrap{position:relative;height:84px;margin:18px 0 22px}
.spark{position:absolute;inset:0;width:100%;height:100%}
.sd{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(255,255,255,.22)}
.sd.gold{background:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 35%,transparent)}
.sl{position:absolute;top:100%;margin-top:4px;transform:translateX(-50%);font-size:11.5px;color:rgba(255,255,255,.75);white-space:nowrap}
.sl.end{right:0;transform:none;color:var(--gold);font-weight:600}
.hero-alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.alert-chip{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.95);color:#5A1E12;font-size:13px}
.alert-chip .ac-dot{width:8px;height:8px;border-radius:50%;background:#E0533B;flex:none}
.alert-chip .ac-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert-chip .ac-go{font-weight:700;color:#B33A23;white-space:nowrap}
.alert-chip:focus-visible{outline:2px solid var(--gold)}
.qa-ic{background:color-mix(in srgb,var(--c) 16%,transparent)!important;color:var(--c)!important}
.qa-primary{background:var(--accent)!important;color:var(--on-accent)!important}
.qa-primary .gsub{color:color-mix(in srgb,var(--on-accent) 80%,transparent)}
.qa-primary .qa-ic{background:rgba(255,255,255,.2)!important;color:var(--on-accent)!important}
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:grid!important;grid-template-columns:1fr auto 1fr;align-items:center;margin:-14px calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:10px max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(14px);backdrop-filter:saturate(1.5) blur(14px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
@media (min-width:761px){.navbar{display:none!important}}
.nb-back{all:unset;cursor:pointer;color:var(--accent);font-weight:500;font-size:16px;justify-self:start;padding:4px 0;display:inline-flex;align-items:center;gap:6px}
.nb-title{font-weight:600;font-size:16px;opacity:0}
.nb-act{all:unset;cursor:pointer;justify-self:end;color:var(--accent);font-size:28px;line-height:1;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.nb-act:focus-visible{outline:2px solid var(--accent)}

/* ---------- derived numbers ---------- */
const debtPayments=d=>S.payments.filter(p=>p.debtId===d.id);
const balance=d=>Math.max(0,round2(d.opening-sum(debtPayments(d).filter(p=>p.ts>d.asOfTs),p=>p.amount)));
const activeDebts=()=>S.debts.filter(d=>balance(d)>0.005);
const totalOwed=()=>sum(S.debts,balance);
const totalOriginal=()=>sum(S.debts,d=>d.original);
const totalPaid=()=>sum(S.payments,p=>p.amount);
const fundBalance=()=>round2(sum(S.fund.entries,e=>e.amount));
/* 0% and other promo periods: promoApr applies up to and including the promoEnd month */
const rateAt=(d,idx)=>d.promoEnd&&idx<=mIndex(d.promoEnd)?(+d.promoApr||0):(+d.apr||0);
const onPromo=d=>!!d.promoEnd&&mIndex(d.promoEnd)>=nowIdx();
const fmtRate=r=>(+r%1?(+r).toFixed(1):String(+r))+"%";
function promoInfo(d){
  if(!onPromo(d))return null;
  const end=mIndex(d.promoEnd),p=plan(),b=balance(d);
  let left=b;
  if(p.paidOff[d.id]!=null&&p.paidOff[d.id]<=end)left=0;
  else{const r=p.months.find(r=>r.idx===end);if(r)left=r.bals[d.id]||0;else if(p.months.length&&end>p.months[p.months.length-1].idx)left=0}
  const n=Math.max(1,end-nowIdx());
  return {end,left:round2(left),need:round2(b/n),monthsLeft:end-nowIdx()};
}

function orderDebts(list,strategy){
  const a=[...list];
  if(strategy==="avalanche")a.sort((x,y)=>y.apr-x.apr||x.b-y.b);
  else if(strategy==="custom")a.sort((x,y)=>(x.order??99)-(y.order??99));
  else a.sort((x,y)=>x.b-y.b||y.apr-x.apr);
  return a;
}
function simulate(strategy,extra,rollover=true){
  let ds=S.debts.map(d=>({id:d.id,name:d.name,apr:+d.apr||0,promoApr:d.promoApr,promoEnd:d.promoEnd,min:+d.min||0,b:balance(d),order:d.order})).filter(d=>d.b>0.005);
  const start=nowIdx()+1;
  // avalanche ranks by today's rate, so a 0% card waits until its promo ends
  ds.forEach(d=>{d.apr0=d.apr;d.apr=rateAt(d,start)});
  const ordered=orderDebts(ds,strategy);
  ds.forEach(d=>{d.apr=d.apr0});
  const budget=sum(ds,d=>d.min)+(rollover?(+extra||0):0);
  const months=[];let totalInt=0;const paidOff={};
  for(let m=0;m<600&&ds.some(d=>d.b>0.005);m++){
    const idx=start+m,row={idx,pays:{},interest:0,bals:{}};
    ds.forEach(d=>{if(d.b>0.005){const i=d.b*rateAt(d,idx)/1200;d.b+=i;row.interest+=i;totalInt+=i}});
    let avail=budget;
    ds.forEach(d=>{if(d.b>0.005){const p=Math.min(d.min,d.b);d.b-=p;avail-=p;row.pays[d.id]=p}});
    const ord=strategy==="avalanche"?[...ds].sort((x,y)=>rateAt(y,idx)-rateAt(x,idx)||x.b-y.b):ordered;
    if(rollover)for(const d of ord){if(avail<=0.005)break;if(d.b>0.005){const p=Math.min(avail,d.b);d.b-=p;avail-=p;row.pays[d.id]=(row.pays[d.id]||0)+p}}
    ds.forEach(d=>{if(d.b<=0.005&&paidOff[d.id]==null){d.b=0;paidOff[d.id]=idx}row.bals[d.id]=d.b});
    row.balance=sum(ds,d=>d.b);row.total=sum(Object.values(row.pays));months.push(row);
  }
  const done=ds.every(d=>d.b<=0.005);
  let order=ordered.map(d=>d.id);
  if(strategy!=="custom")order=[...order].sort((a,b)=>(paidOff[a]??1e9)-(paidOff[b]??1e9)||order.indexOf(a)-order.indexOf(b));
  return {months,totalInt,paidOff,done,order,budget,finish:done?(months.length?months[months.length-1].idx:nowIdx()):null};
}
let planCache=null;
const plan=()=>planCache||(planCache=simulate(S.strategy,S.extra));
const paidThisMonth=d=>sum(debtPayments(d).filter(p=>pk(p.date)===monthKey()),p=>p.amount);
function plannedThisMonth(d){const p=plan();return round2(p.months[0]?.pays[d.id]||0)}
function suggestedNext(){
  const p=plan();const act=activeDebts();if(!act.length)return null;
  const byId=Object.fromEntries(act.map(d=>[d.id,d]));
  const remaining=act.map(d=>({d,left:plannedThisMonth(d)-paidThisMonth(d),due:d.dueDay||31}));
  const due=remaining.filter(r=>r.left>0.5).sort((a,b)=>dueDist(a.d)-dueDist(b.d));
  if(due.length)return {debt:due[0].d,amount:round2(due[0].left)};
  return {debt:byId[p.order[0]]||act[0],amount:0};
}
function dueDist(d){const t=new Date().getDate();const dd=d.dueDay||28;return dd>=t?dd-t:dd+31-t}
function nextDueDate(d){const n=new Date();let dt=new Date(n.getFullYear(),n.getMonth(),Math.min(d.dueDay||28,28));if(d.dueDay>28){const last=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();dt.setDate(Math.min(d.dueDay,last))}if(dt.getDate()<n.getDate()&&dt.getMonth()===n.getMonth())dt=new Date(n.getFullYear(),n.getMonth()+1,Math.min(d.dueDay||28,28));return dt}

/* budget */
function ensureMonth(k){
  if(S.budget.months[k])return S.budget.months[k];
  const keys=Object.keys(S.budget.months).filter(x=>x<k).sort();
  const prev=keys.length?S.budget.months[keys[keys.length-1]]:{income:0,assigned:{}};
  return {income:prev.income,assigned:{...prev.assigned},_virtual:true};
}
function materialise(k){const m=ensureMonth(k);if(m._virtual){delete m._virtual;S.budget.months[k]=m}return S.budget.months[k]}
const allCats=()=>S.budget.groups.flatMap(g=>g.cats.map(c=>({...c,group:g})));
const spent=(catId,k)=>sum(S.txns.filter(t=>t.catId===catId&&pk(t.date)===k),t=>t.amount);
const fundIn=k=>sum(S.fund.entries.filter(e=>e.amount>0&&pk(e.date)===k),e=>e.amount);
function debtPlannedFor(k){
  const i=mIndex(k), n=nowIdx();
  if(i<n)return sum(S.payments.filter(p=>pk(p.date)===k),p=>p.amount);
  const p=plan(); if(!S.debts.length)return 0;
  if(i===n)return sum(S.debts,d=>Math.max(plannedThisMonth(d),paidThisMonth(d)));
  return round2(p.months[i-n-1]?.total||0);
}
function debtRowFor(d,k){
  const i=mIndex(k),n=nowIdx();
  const paid=sum(debtPayments(d).filter(p=>pk(p.date)===k),p=>p.amount);
  let planned=paid;
  if(i===n)planned=Math.max(plannedThisMonth(d),paid);
  else if(i>n)planned=round2(plan().months[i-n-1]?.pays[d.id]||0);
  return {planned,paid};
}
function carryFor(catId,k){
  let carry=0;const keys=Object.keys(S.budget.months).filter(x=>x<k).sort();
  for(const kk of keys){const a=(S.budget.months[kk].assigned[catId]||0)-spent(catId,kk);carry=Math.max(0,carry+a)}
  return round2(carry);
}
function availableFor(catId,k){const m=ensureMonth(k);return carryFor(catId,k)+(m.assigned[catId]||0)-spent(catId,k)}
function essentialsMonthly(){
  const m=ensureMonth(monthKey());
  const ess=sum(S.budget.groups.filter(g=>g.essential).flatMap(g=>g.cats),c=>m.assigned[c.id]||0);
  return ess+sum(activeDebts(),d=>d.min);
}
const fundTarget=()=>S.fund.targetMode==="fixed"||essentialsMonthly()<=0?(+S.fund.fixed||0):round2(essentialsMonthly()*(+S.fund.months||3));
function fundMonthly(){const m=ensureMonth(monthKey());return +m.assigned.fund||0}

function setSaveState(t){const el=$("#savestate");if(el)el.textContent=t}
function scheduleSave(){
  planCache=null;

let saving=false,again=false;
async function doSave(){
  if(saving){again=true;return}
  saving=true;const body=JSON.parse(JSON.stringify(S));const snap=JSON.stringify(body);
  try{
    if(mode==="db"&&ref){await ref.set(body)}

  }catch(e){setSaveState(e&&e.code==="quota_exceeded"?"Storage is full. Delete old entries to keep saving.":"Couldn't save. Your last change will retry.");again=true}
  saving=false;if(again){again=false;setTimeout(doSave,1500)}
}
function commit(){scheduleSave();render()}
const PTS_KEY="clearway-points";
function points(){try{return JSON.parse(localStorage.getItem(PTS_KEY)||"[]")}catch(e){return []}}
function savePoint(snap){try{const p=points();const d=todayStr();const i=p.findIndex(x=>x.date===d);const prev=p.filter(x=>x.date!==d);if(i>=0&&p[i].first)return;

  const p=points();
  openModal(`<h2>Restore points</h2><p class="muted" style="margin:0">Clearway keeps a copy of your data from the start of each of the last 7 days you used it. Restoring replaces what's on this device now.</p>

function loadLocal(){
  let raw=null;try{raw=localStorage.getItem(LS_KEY)}catch(e){}
  if(raw){try{S=migrate(JSON.parse(raw));isExample=false}catch(e){S=example();isExample=true}}
  else{S=example();isExample=true}
  render();
}
function migrate(s){const b=blank();s.accounts=s.accounts||[];s.nw=s.nw||{};s.budget=s.budget||b.budget;s.fund=s.fund||b.fund;s.txns=s.txns||[];s.payments=s.payments||[];s.debts=s.debts||[];return s}

async function boot(){
  if(lockInfo())showLock();
  mode="local";
  if(!window.claude||typeof window.claude.use!=="function"){loadLocal();setSaveState("Saved on this device");standaloneInit();return}
  let settled=false;
  const timer=setTimeout(()=>{if(!settled){settled=true;loadLocal();setSaveState("Your account isn't reachable yet. Changes stay in this browser.")}},10000);
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    const id=user&&await user.id();
    if(!db||!id){clearTimeout(timer);if(!settled){settled=true;loadLocal()}return}
    ref=db.doc(`data/users/${id}/ledger`);
    ref.onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites)return;
      if(!snap.exists){
        if(!settled){settled=true;clearTimeout(timer);mode="db";
          let raw=null;try{raw=localStorage.getItem(LS_KEY)}catch(e){}
          if(raw){try{S=migrate(JSON.parse(raw));isExample=false;doSave()}catch(e){S=example();isExample=true}}else{S=example();isExample=true}
          setSaveState(isExample?"Example data — nothing saved yet":"Saved to your account");render()}
        return;
      }
      const data=snap.data();const str=JSON.stringify(data);
      if(!snap.metadata.fromCache&&!settled){settled=true;clearTimeout(timer)}
      mode="db";
      if(str===lastSaved&&S)return;
      if(saveTimer&&S&&!isExample&&lastSaved&&str!==lastSaved&&saving)return;
      S=migrate(JSON.parse(str));isExample=false;lastSaved=str;planCache=null;fmtCache={};
      setSaveState("Saved to your account");render();
    },err=>{if(!settled){settled=true;clearTimeout(timer);loadLocal()}else setSaveState("Lost connection to your account. Reload to reconnect.")});
  }catch(e){clearTimeout(timer);if(!settled){settled=true;loadLocal()}}
}
function leaveExample(fresh){
  if(fresh){const c=S.currency;S=blank();S.currency=c}
  isExample=false;fmtCache={};commit();
  toast(fresh?"Examples cleared. Add your first debt to begin.":"Keeping the examples. Edit or delete them any time.");
  if(fresh)openDebtModal();
}

function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return ([1,1.2,1.5,2,2.5,3,4,5,6,8,10].find(x=>n<=x))*p}
function lineChart(series,{h=230,w=720,yFmt=v=>money(v,{whole:true}),marker}={}){

  const x0=Math.min(...pts.map(p=>p.x)),x1=Math.max(...pts.map(p=>p.x),x0+1);

  const L=62,R=14,T=12,B=28;const X=x=>L+(x-x0)/(x1-x0)*(w-L-R);const Y=y=>T+(1-y/ymax)*(h-T-B);
  let g="";for(let i=0;i<=4;i++){const v=ymax*i/4;g+=`<line x1="${L}" x2="${w-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${esc(yFmt(v))}</text>`}
  const span=x1-x0;const pxPer=(w-L-R)/Math.max(1,span);const step=[1,2,3,6,12,24].find(st=>pxPer*st>=60)||24;
  for(let x=Math.ceil(x0/step)*step;x<=x1;x+=step){const px=X(x);g+=`<text x="${px}" y="${h-8}" text-anchor="${px>w-R-24?"end":px<L+20?"start":"middle"}">${esc(mLabel(x))}</text>`}
  let paths="";
  series.forEach(s=>{if(!s.points.length)return;const d=s.points.map((p,i)=>`${i?"L":"M"}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
    if(s.fill){const gid="g"+Math.random().toString(36).slice(2,7);paths+=`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".28"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs><path d="${d}L${X(s.points[s.points.length-1].x)},${Y(0)}L${X(s.points[0].x)},${Y(0)}Z" fill="url(#${gid})"/>`}
    paths+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width||2.4}" ${s.dash?'stroke-dasharray="5 5"':""} stroke-linejoin="round" stroke-linecap="round"/>`;
    if(s.end){const p=s.points[s.points.length-1];paths+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`}});
  if(marker!=null&&marker>=x0&&marker<=x1)paths+=`<line x1="${X(marker)}" x2="${X(marker)}" y1="${T}" y2="${h-B}" stroke="var(--ink-3)" stroke-dasharray="2 4"/><text x="${X(marker)+5}" y="${T+10}">Today</text>`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Chart">${g}${paths}</svg>`;
}
function spark(pts,todayX){
  if(pts.length<2)return "";
  const w=600,h=84,x0=pts[0].x,x1=pts[pts.length-1].x,ym=Math.max(...pts.map(p=>p.y))||1;
  const X=x=>((x-x0)/Math.max(1,x1-x0)*(w-12)+6).toFixed(1),Y=y=>(8+(1-y/ym)*(h-16)).toFixed(1);
  const past=pts.filter(p=>p.x<=todayX),fut=pts.filter(p=>p.x>=todayX);
  const line=a=>a.map((p,i)=>(i?"L":"M")+X(p.x)+","+Y(p.y)).join("");
  const t=past[past.length-1]||pts[0],e=pts[pts.length-1];
  const px=x=>(X(x)/w*100).toFixed(2),py=y=>(Y(y)/h*100).toFixed(2);
  return `<div class="spark-wrap"><svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${line(past)}L${X(t.x)},${h}L${X(pts[0].x)},${h}Z" fill="rgba(255,255,255,.12)"/><path d="${line(past)}" fill="none" stroke="#fff" stroke-width="2.5" vector-effect="non-scaling-stroke"/><path d="${line(fut)}" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="2" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/></svg><span class="sd" style="left:${px(t.x)}%;top:${py(t.y)}%"></span><span class="sd gold" style="left:${px(e.x)}%;top:${py(e.y)}%"></span><span class="sl" style="left:${px(t.x)}%">Today</span><span class="sl end">${mLabel(e.x)}</span></div>`;
}
function ring(pct,color,size=64,stroke=8,label){
  const r=(size-stroke)/2,c=2*Math.PI*r,o=c*(1-Math.max(0,Math.min(1,pct)));
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${o}" transform="rotate(-90 ${size/2} ${size/2})"/>${label?`<text x="50%" y="54%" text-anchor="middle" font-size="${size/4.4}" font-weight="700" fill="var(--ink)" font-family="var(--display)">${label}</text>`:""}</svg>`;
}
function historyPoints(){
  if(!S.debts.length)return [];
  const startIdx=Math.min(...S.debts.map(d=>{const t=new Date(d.createdTs||Date.now());return t.getFullYear()*12+t.getMonth()}));
  const pts=[];const n=nowIdx();
  for(let i=startIdx;i<=n;i++){
    const end=i===n?Date.now():new Date(Math.floor((i+1)/12),(i+1)%12,1).getTime()-1;
    const tot=sum(S.debts.filter(d=>(d.createdTs||0)<=end),d=>Math.max(0,d.original-sum(debtPayments(d).filter(p=>p.ts<=end),p=>p.amount)));
    pts.push({x:i,y:tot});
  }
  if(pts.length===1)pts.unshift({x:startIdx-1,y:totalOriginal()});
  pts[pts.length-1].y=totalOwed();
  return pts;
}

/* ---------- bank statement import (CSV), all on this device ---------- */
function parseCSV(text){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;else if(c===","||c===";"&&!text.includes(",")){row.push(cell);cell=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""}
    else cell+=c}
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(Boolean));
}
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function parseDate(s){
  s=s.trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if(m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/)){const y=m[3].length===2?"20"+m[3]:m[3];return `${y}-${pad(+m[2])}-${pad(+m[1])}`}
  if(m=s.match(/^(\d{1,2})[\s\-]([A-Za-z]{3})[A-Za-z]*[\s\-](\d{2,4})/)){const mo=MON[m[2].toLowerCase()];if(mo){const y=m[3].length===2?"20"+m[3]:m[3];return `${y}-${pad(mo)}-${pad(+m[1])}`}}
  return null;
}
const CAT_RULES=[[/groc/i,/tesco|sainsbury|asda|aldi|lidl|morrisons|waitrose|co-?op|ocado|iceland|m&s food|spar/i],[/transport/i,/\btfl\b|trainline|uber(?! ?eats)|shell|\bbp\b|esso|texaco|petrol|parking|rail|bus|national express/i],[/eat/i,/deliveroo|just ?eat|uber ?eats|mcdonald|kfc|nando|costa|starbucks|pret|greggs|restaurant|cafe|pub|pizza|burger/i],[/subs/i,/netflix|spotify|disney|prime video|amazon prime|apple\.com|icloud|google|youtube|now tv|audible|patreon/i],[/phone|internet/i,/vodafone|\bee\b|\bo2\b|three|\bbt\b|\bsky\b|virgin|plusnet|talktalk|giffgaff|tesco mobile/i],[/energy|water|util/i,/octopus|british gas|edf|e\.?on|ovo|thames water|water|scottish power|bulb|council tax/i],[/rent|mortgage/i,/rent|mortgage|letting|landlord/i],[/insur/i,/insurance|aviva|admiral|direct line|axa|lv=|churchill|hastings/i]];
function suggestFor(desc){
  const d=desc.toLowerCase();
  for(const debt of activeDebts()){const n=debt.name.toLowerCase();const first=n.split(/\s+/).find(w=>w.length>=4&&!/card|loan|credit|store|finance/.test(w));if(d.includes(n)||(first&&d.includes(first)))return "debt:"+debt.id}
  const cats=allCats();
  for(const [catRe,re] of CAT_RULES){if(re.test(desc)){const c=cats.find(c=>catRe.test(c.name));if(c)return "cat:"+c.id}}
  return "skip";
}

const TAX_YEAR="2026/27";
const RUK_BANDS=[[37700,.20],[125140,.40],[Infinity,.45]];
const SCOT_BANDS=[[2827,.19],[14921,.20],[31092,.21],[62430,.42],[125140,.45],[Infinity,.48]];
const LOANS={none:null,"1":[26065,.09,"Plan 1"],"2":[28470,.09,"Plan 2"],"4":[32745,.09,"Plan 4 (Scotland)"],"5":[25000,.09,"Plan 5"],pg:[21000,.06,"Postgraduate"]};
const payDefaults=()=>({salary:0,period:"year",region:"ruk",pension:5,pensionType:"netpay",loan:"none",code:"1257L",sync:true});
function bandTax(taxable,bands){let tax=0,prev=0,rows=[];for(const [top,rate] of bands){if(taxable<=prev)break;const part=Math.min(taxable,top)-prev;tax+=part*rate;rows.push([rate,part]);prev=top}return {tax,rows}}
function calcPay(p){
  const G=Math.max(0,p.period==="month"?(+p.salary||0)*12:(+p.salary||0));
  const pen=G*Math.max(0,+p.pension||0)/100;
  const forTax=G-(p.pensionType==="after"?0:pen), forNI=G-(p.pensionType==="sacrifice"?pen:0);
  const m=String(p.code||"1257L").toUpperCase().match(/^(\d+)[LMNT]?$/);
  let pa=m?(+m[1])*10+9:12579;
  if(forTax>100000)pa=Math.max(0,pa-Math.floor((forTax-100000)/2));
  const taxable=Math.max(0,forTax-pa);
  const {tax,rows}=bandTax(taxable,p.region==="scot"?SCOT_BANDS:RUK_BANDS);
  const ni=Math.max(0,Math.min(forNI,50270)-12570)*.08+Math.max(0,forNI-50270)*.02;
  const L=LOANS[p.loan];const loan=L?Math.max(0,forNI-L[0])*L[1]:0;
  const penOut=p.pensionType==="after"?pen*.8:pen;
  const net=G-tax-ni-loan-penOut;
  const marginal=(()=>{const b=p.region==="scot"?SCOT_BANDS:RUK_BANDS;let r=0,prev=0;for(const [top,rate] of b){if(taxable>prev)r=rate;prev=top}const niM=forNI>50270?.02:forNI>12570?.08:0;return taxable>0?r+niM+(L&&forNI>L[0]?L[1]:0):niM})();
  return {G,pa,taxable,tax,rows,ni,loan,pen,penOut,net,eff:G?(tax+ni)/G:0,marginal};
}

const ACC_TYPES=[["current","Current account","🏦"],["savings","Savings","💰"],["isa","ISA","🌱"],["cash","Cash","💵"],["invest","Investments","📈"],["pension","Pension","🏖️"],["other","Other","🏷️"]];

const accIco=k=>{const [ic,c]=ACC_ICON[k]||ACC_ICON.other;const path=ic==="card"?'<rect x="2.5" y="5" width="15" height="10" rx="2"/><path d="M2.5 8.5h15M5.5 12.5h3"/>':ic==="accounts"?'<path d="M3 8 10 3.5 17 8"/><path d="M4.5 8.5v6M8.5 8.5v6M11.5 8.5v6M15.5 8.5v6M3 16.5h14"/>':P[ic];return `<span class="gico" style="background:${c}"><svg viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${path}</svg></span>`};

function nwSeries(){
  // months back from the earliest account history or debt, rebuilt from account histories, fund entries and debt payments
  const n=nowIdx();const starts=[...(S.accounts||[]).flatMap(a=>(a.history||[]).map(h=>mIndex(h.date.slice(0,7)))),...S.debts.map(d=>{const t=new Date(d.createdTs||Date.now());return t.getFullYear()*12+t.getMonth()})];
  const s0=Math.max(n-11,starts.length?Math.min(...starts):n);const pts=[];
  for(let i=s0;i<=n;i++){
    const end=i===n?Date.now():new Date(Math.floor((i+1)/12),(i+1)%12,1).getTime()-1;
    const acc=sum(S.accounts||[],a=>{if(i===n)return +a.balance||0;const h=(a.history||[]).filter(x=>mIndex(x.date.slice(0,7))<=i).pop();return h?h.balance:0});
    const fund=sum(S.fund.entries.filter(e=>e.ts<=end),e=>e.amount);
    const owed=i===n?totalOwed():sum(S.debts.filter(d=>(d.createdTs||0)<=end),d=>Math.max(0,d.original-sum(debtPayments(d).filter(p=>p.ts<=end),p=>p.amount)));
    pts.push({x:i,y:round2(acc+fund-owed)});
  }
  return pts;
}

/* ---------- app lock (privacy screen, not encryption) ---------- */
const LOCK_KEY="clearway-lock";
function lockInfo(){try{return JSON.parse(localStorage.getItem(LOCK_KEY)||"null")}catch(e){return null}}
async function hashPin(salt,pin){
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pin));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){let h=0;for(const ch of salt+pin)h=(h*31+ch.charCodeAt(0))|0;return String(h)}
}
function keypad(title,sub,onDone,opts={}){
  let pin="";
  const host=opts.full?document.getElementById("lock"):null;
  const html=`<div class="lockbox"><div class="lockicon">${I.lock}</div><h2>${esc(title)}</h2><p class="muted" id="kp-sub">${esc(sub)}</p><div class="dots" id="kp-dots">${"<i></i>".repeat(4)}</div>
    <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join("")}<button data-k="x" class="kalt">${opts.cancel?"Cancel":""}</button><button data-k="0">0</button><button data-k="b" class="kalt" aria-label="Delete">⌫</button></div>${opts.bio?`<button class="btn small" data-k="bio" style="margin-top:6px">Use ${bioName()}</button>`:""}${opts.forgot?`<button class="btn ghost small" data-k="f" style="margin-top:4px">Forgot PIN?</button>`:""}</div>`;
  let root;
  if(host){host.innerHTML=html;host.hidden=false;root=host}else{openModal(html);root=$("#layer .modal");root.classList.add("kp-modal")}
  const dots=()=>root.querySelectorAll("#kp-dots i").forEach((d,i)=>d.classList.toggle("on",i<pin.length));
  const press=async k=>{
    if(k==="b")pin=pin.slice(0,-1);
    else if(k==="x"){if(opts.cancel){modalClose&&modalClose();opts.cancel()}return}
    else if(k==="f"){opts.forgot&&opts.forgot(root);return}
    else if(k==="bio"){bioUnlock();return}
    else if(/\d/.test(k)&&pin.length<4)pin+=k;
    dots();
    if(pin.length===4){const p=pin;pin="";const res=await onDone(p,root);if(res===false){root.querySelector("#kp-dots").classList.add("shake");setTimeout(()=>{root.querySelector("#kp-dots")?.classList.remove("shake");dots()},380)}}
  };
  root.addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(b)press(b.dataset.k)});
  const kd=e=>{if(!document.body.contains(root)||(host&&host.hidden)){document.removeEventListener("keydown",kd);return}if(/^\d$/.test(e.key))press(e.key);else if(e.key==="Backspace")press("b")};
  document.addEventListener("keydown",kd);
}
function showLock(){
  const lk=lockInfo();if(!lk)return;
  keypad("Clearway is locked","Enter your PIN",async(p)=>{
      const st=JSON.parse(localStorage.getItem("clearway-fails")||'{"n":0,"until":0}');const sub=document.getElementById("kp-sub");
      if(Date.now()<st.until){if(sub)sub.textContent="Too many tries. Wait "+Math.ceil((st.until-Date.now())/1000)+" seconds.";return false}
      if(await hashPin(lk.salt,p)===lk.hash){localStorage.removeItem("clearway-fails");const h=document.getElementById("lock");h.hidden=true;h.innerHTML="";return true}
      st.n++;if(lk.wipe&&st.n>=10){[LS_KEY,LOCK_KEY,PTS_KEY,"clearway-fails"].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});location.reload();return false}
      if(st.n>=5)st.until=Date.now()+30000*Math.pow(2,st.n-5);localStorage.setItem("clearway-fails",JSON.stringify(st));
      if(sub)sub.textContent=st.n>=5?`Wrong PIN. Wait ${Math.round((st.until-Date.now())/1000)} seconds before trying again.`:`That PIN didn't match. ${(lk.wipe?10:5)-st.n} tr${(lk.wipe?10:5)-st.n===1?"y":"ies"} left${lk.wipe?" before everything is erased":" before a wait"}.`;
      return false},
    {full:true,bio:!!lk.bio,forgot:root=>{root.querySelector("#kp-sub").innerHTML='The PIN can\'t be recovered. To get back in, delete all data on this device and restore from a backup. <button class="btn small danger" data-k-reset>Delete all data</button>';
      root.querySelector("[data-k-reset]").onclick=()=>{try{localStorage.removeItem(LS_KEY);localStorage.removeItem(LOCK_KEY)}catch(e){}location.reload()}}});
}
function setupPin(change){
  keypad(change?"New PIN":"Choose a PIN","Enter 4 digits",first=>{
    keypad("Confirm PIN","Enter it again",async(second,root)=>{
      if(second!==first){root.querySelector("#kp-sub").textContent="Those didn't match. Try again.";setTimeout(()=>setupPin(change),700);return false}
      const salt=uid();const lk={salt,hash:await hashPin(salt,second),after:lockInfo()?.after??60000};try{localStorage.setItem(LOCK_KEY,JSON.stringify(lk))}catch(e){toast("Couldn't save the PIN on this device.");return}
      modalClose&&modalClose();render();toast(change?"PIN changed.":"App lock is on. You'll enter your PIN each time you open Clearway.");return true},{cancel:()=>render()});
    return true},{cancel:()=>render()});
}

    case "pay-debt":openPayModal(b.dataset.id,b.dataset.amount!=null?+b.dataset.amount:undefined);break;
    case "edit-debt":openDebtModal(b.dataset.id);break;
    case "toggle-hide":S.hide=!S.hide;fmtCache={};if(isExample)render();else commit();break;
    case "theme":S.theme=b.dataset.v;if(isExample)render();else commit();break;
    case "lock-toggle":if(lockInfo()){try{localStorage.removeItem(LOCK_KEY)}catch(e){}render();toast("App lock is off.")}else setupPin(false);break;
    case "lock-change":setupPin(true);break;
    case "export-csv":exportCSV();break;
    case "export-ics":exportICS();break;
    case "wipe-toggle":{const lk=lockInfo();if(lk){lk.wipe=!lk.wipe;localStorage.setItem(LOCK_KEY,JSON.stringify(lk));render();toast(lk.wipe?"After 10 wrong PINs, everything on this device will be erased.":"Wrong PINs now only add a waiting time.")}break}
    case "install-help":openModal(`<h2>Install Clearway</h2><div class="glist"><div class="gi">${ico("Add to home screen")}<div class="gl"><div>iPhone</div><div class="gsub">Open this page in Safari, tap Share, then Add to Home Screen.</div></div></div><div class="gi">${ico("Add to home screen")}<div class="gl"><div>Android</div><div class="gsub">Open in Chrome, tap ⋮, then Install app.</div></div></div></div><p class="muted" style="margin:0">Then open Clearway from its icon. It runs full screen, works offline, and your data is protected from automatic clean-up.</p><div class="modal-actions"><button class="btn primary" data-close>Done</button></div>`);break;
    case "text-size":S.textSize=b.dataset.v;if(isExample)render();else commit();break;
    case "scroll-promo":{const n=document.querySelector(".promo-note.bad");if(n){n.scrollIntoView({behavior:"smooth",block:"center"});n.animate&&n.animate([{boxShadow:"0 0 0 3px var(--owed)"},{boxShadow:"0 0 0 0 transparent"}],{duration:1200})}break}
    case "cover-toggle":S.cover=S.cover===false;if(isExample)render();else commit();break;
    case "open-points":openPoints();break;
    case "bio-toggle":{const lk=lockInfo();if(lk&&lk.bio){delete lk.bio;localStorage.setItem(LOCK_KEY,JSON.stringify(lk));render();toast(bioName()+" is off.")}else bioEnable();break}
    case "alert-toggle":{S.alerts=S.alerts||{};const k=b.dataset.k;S.alerts[k]=S.alerts[k]===false;if(isExample)render();else commit();break}
    case "lock-after":{const lk=lockInfo();if(lk){lk.after=+b.dataset.v;try{localStorage.setItem(LOCK_KEY,JSON.stringify(lk))}catch(e){}render()}break}
    case "essential-toggle":{const g=S.budget.groups.find(x=>"ess-"+x.id===b.id);if(g){g.essential=!g.essential;if(isExample)leaveExampleSilently();commit()}break}
    case "move-cat":{const g=S.budget.groups.find(g=>g.cats.some(c=>c.id===b.dataset.id));const i=g.cats.findIndex(c=>c.id===b.dataset.id),j=i+ +b.dataset.dir;if(j<0||j>=g.cats.length)break;[g.cats[i],g.cats[j]]=[g.cats[j],g.cats[i]];if(isExample)leaveExampleSilently();commit();break}
    case "del-cat":{const id=b.dataset.id;const used=S.txns.filter(t=>t.catId===id).length;const g=S.budget.groups.find(g=>g.cats.some(c=>c.id===id));const c=g.cats.find(c=>c.id===id);
      if(used&&b.dataset.confirm!=="1"){b.dataset.confirm="1";b.classList.add("danger-armed");b.innerHTML="Delete?";toast(c.name+" has "+used+" purchase"+(used>1?"s":"")+". Tap Delete? again to remove it and them.");break}
      const snap=JSON.stringify({groups:S.budget.groups,txns:S.txns});g.cats=g.cats.filter(x=>x.id!==id);S.txns=S.txns.filter(t=>t.catId!==id);if(isExample)leaveExampleSilently();commit();toast("Deleted "+c.name+".",()=>{const o=JSON.parse(snap);S.budget.groups=o.groups;S.txns=o.txns;commit()});break}
    case "add-cat-in":openCatSheet(null,b.dataset.id);break;
    case "add-account":openAccountSheet(null);break;
    case "edit-fund-target":{const el=document.getElementById("fund-setup");if(el){el.scrollIntoView({behavior:"smooth",block:"start"});setTimeout(()=>{const i=document.getElementById("fund-target-amt");i&&i.focus({preventScroll:true});i&&i.select()},450)}break}
    case "quick-bal":{const a=(S.accounts||[]).find(x=>x.id===b.dataset.id);if(a)openAccountSheet(a.id);break}
    case "acc-range":accRange=b.dataset.v;render();break;
    case "edit-account":openAccountSheet(b.dataset.id);break;
    case "edit-cat":openCatSheet(b.dataset.id);break;
    case "edit-group":openGroupSheet(b.dataset.id);break;
    case "add-group":openGroupSheet(null);break;
    case "del-group":{const g=S.budget.groups.find(x=>x.id===b.dataset.id);if(g.cats.length&&b.dataset.confirm!=="1"){b.dataset.confirm="1";b.classList.add("danger-armed");toast("Tap the bin again to delete "+g.name+" and its "+g.cats.length+" categor"+(g.cats.length>1?"ies":"y")+".");break}
      const snap=JSON.stringify({groups:S.budget.groups,txns:S.txns});const ids=new Set(g.cats.map(c=>c.id));S.budget.groups=S.budget.groups.filter(x=>x.id!==g.id);S.txns=S.txns.filter(t=>!ids.has(t.catId));if(isExample)leaveExampleSilently();commit();toast("Deleted "+g.name+".",()=>{const o=JSON.parse(snap);S.budget.groups=o.groups;S.txns=o.txns;commit()});break}
    case "promo-prioritise":{const o=plan().order.filter(id=>id!==b.dataset.id);o.unshift(b.dataset.id);o.forEach((id,k)=>{const d=S.debts.find(x=>x.id===id);if(d)d.order=k});S.debts.forEach(d=>{if(!o.includes(d.id))d.order=o.length+1});S.strategy="custom";if(isExample)leaveExampleSilently();commit();const d=S.debts.find(x=>x.id===b.dataset.id);const pi=promoInfo(d);toast(pi&&pi.left>0.5?`${d.name} is now first. ${money(pi.left,{whole:true})} would still be left; add to your extra payment to close the gap.`:`${d.name} is now first and clears before its 0% ends.`);break}
    case "keep-example":leaveExample(false);break;
    case "clear-example":leaveExample(true);break;
    case "strategy":if(S.strategy==="custom"||b.dataset.v==="custom"){const p=plan();p.order.forEach((id,i)=>{const d=S.debts.find(x=>x.id===id);if(d&&b.dataset.v==="custom"&&S.strategy!=="custom")d.order=i})}S.strategy=b.dataset.v;commit();break;
    case "move":{const p=plan();const o=[...p.order];const i=o.indexOf(b.dataset.id),j=i+ +b.dataset.dir;if(j<0||j>=o.length)break;[o[i],o[j]]=[o[j],o[i]];o.forEach((id,k)=>{S.debts.find(x=>x.id===id).order=k});commit();break}
    case "month":budgetMonth=keyFromIndex(mIndex(budgetMonth)+ +b.dataset.dir);editing=null;render();break;
    case "month-now":budgetMonth=monthKey();render();break;
    case "edit-cell":editing=b.dataset.key;render();break;
    case "add-txn":openTxnModal(b.dataset.cat);break;
    case "add-cat":openCatModal();break;
    case "fund-add":openFundModal(false,b.dataset.amount,b.dataset.note);break;
    case "fund-withdraw":openFundModal(true);break;
    case "fund-pick":{const v=b.dataset.v;if(v==="starter"){S.fund.targetMode="fixed";S.fund.fixed=1000}else{S.fund.targetMode="months";S.fund.months=+v.slice(1)}if(isExample)leaveExampleSilently();commit();toast("Target set to "+money(fundTarget(),{whole:true})+".");break}
    case "fund-mode":S.fund.targetMode=b.dataset.v;commit();break;
    case "fund-months":S.fund.months=+b.dataset.v;commit();break;
    case "act-filter":actFilter=b.dataset.v;render();break;
    case "del-payment":delEntry("payments",b.dataset.id,"Payment deleted.");break;
    case "del-txn":delEntry("txns",b.dataset.id,"Spending deleted.");break;
    case "del-fund":{const e=S.fund.entries.find(x=>x.id===b.dataset.id);S.fund.entries=S.fund.entries.filter(x=>x.id!==b.dataset.id);commit();toast("Entry deleted.",()=>{S.fund.entries.push(e);commit()});break}
    case "reset-ask":$("#reset-zone").innerHTML=`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><strong>Delete everything for good?</strong><button class="btn danger" data-action="reset-yes">Yes, delete it all</button><button class="btn ghost" data-action="reset-no">Keep my data</button></div>`;break;
    case "reset-no":render();break;
    case "reset-yes":{const c=S.currency;S=blank();S.currency=c;isExample=false;commit();go("overview");toast("Everything deleted.");break}
  }
});
function delEntry(key,id,msg){const e=S[key].find(x=>x.id===id);S[key]=S[key].filter(x=>x.id!==id);commit();toast(msg,()=>{S[key].push(e);commit()})}
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.action==="fund-monthly"){const v=parseMoney(t.value);const el=$("#fund-eta");if(el)el.innerHTML=etaText(fundBalance(),fundTarget(),v>0?v:0)}
  if(t.dataset.action==="extra-range"){S.extra=+t.value;$("#extra").value=t.value;planCache=null;clearTimeout(t._r);t._r=setTimeout(()=>{commit();const r=$("#extra-range");r&&r.focus()},140)}
});
document.addEventListener("change",e=>{
  const t=e.target;const a=t.dataset.action;
  if(a==="extra-input"){const v=parseMoney(t.value);S.extra=v>=0?v:0;commit()}
  else if(a==="currency"){S.currency=t.value;fmtCache={};commit()}
  else if(a==="backup-every"){S.alerts=S.alerts||{};if(t.value==="0")S.alerts.backup=false;else{S.alerts.backup=true;S.backupEvery=+t.value}if(isExample)leaveExampleSilently();commit()}
  else if(a==="theme-sel"){S.theme=t.value;if(isExample)render();else commit()}
  else if(a==="text-sel"){S.textSize=t.value;if(isExample)render();else commit()}
  else if(a==="region-sel"){S.locale=t.value==="auto"?null:t.value;fmtCache={};if(isExample)render();else commit()}
  else if(a==="strategy-sel"){if(t.value==="custom"&&S.strategy!=="custom"){plan().order.forEach((id,i)=>{const d=S.debts.find(x=>x.id===id);if(d)d.order=i})}S.strategy=t.value;if(isExample)render();else commit()}
  else if(a==="month-start"){S.monthStart=+t.value;budgetMonth=monthKey();if(isExample)leaveExampleSilently();commit();toast(S.monthStart===1?"Budgets now follow calendar months.":"Budget months now run from the "+ordinal(S.monthStart)+".")}
  else if(a==="set-income"){const v=parseMoney(t.value);if(v>=0){materialise(monthKey()).income=v;if(isExample)leaveExampleSilently();commit();toast("Income set to "+money(v,{whole:true})+" a month.")}}
  else if(a==="fund-name"){const v=t.value.trim();if(v){S.fund.name=v;if(isExample)leaveExampleSilently();commit()}}
  else if(a==="rename-cat"){const v=t.value.trim();const c=allCats().find(c=>c.id===t.dataset.id);if(v&&c){S.budget.groups.forEach(g=>g.cats.forEach(x=>{if(x.id===c.id)x.name=v}));if(isExample)leaveExampleSilently();commit()}}
  else if(a==="rename-group"){const v=t.value.trim();const g=S.budget.groups.find(x=>x.id===t.dataset.id);if(v&&g){g.name=v;if(isExample)leaveExampleSilently();commit()}}
  else if(a==="essential"){S.budget.groups.find(g=>g.id===t.dataset.id).essential=t.checked;commit()}
  else if(a==="fund-target-amt"){const v=parseMoney(t.value);if(v>=0){S.fund.targetMode="fixed";S.fund.fixed=v;if(isExample)leaveExampleSilently();commit();toast("Target set to "+money(v,{whole:true})+".")}}
  else if(a==="fund-fixed"){const v=parseMoney(t.value);if(v>=0){S.fund.fixed=v;commit()}}
  else if(a==="fund-target"){if(t.value==="fixed")S.fund.targetMode="fixed";else{S.fund.targetMode="months";S.fund.months=+t.value.slice(1)}commit()}
  else if(a==="fund-monthly"){const v=parseMoney(t.value);if(v>=0){materialise(monthKey()).assigned.fund=v;commit()}}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.matches(".ginput,.gh-input,.gmoney input")){e.preventDefault();e.target.blur();return}
  if(e.target.id==="cell-edit"){if(e.key==="Enter"){e.preventDefault();e.target.blur()}else if(e.key==="Escape"){editing=null;render()}return}
  if(e.key==="Escape"&&modalClose){modalClose();return}
  if(modalClose||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="p"||e.key==="P"){e.preventDefault();openPayModal()}
  else if(e.key==="d"||e.key==="D"){e.preventDefault();openDebtModal()}
});
document.addEventListener("focusout",e=>{
  const t=e.target;if(t.id!=="cell-edit")return;
  const v=parseMoney(t.value);const kind=t.dataset.kind,id=t.dataset.id;editing=null;
  if(isFinite(v)&&v>=0){const m=materialise(budgetMonth);if(kind==="income")m.income=v;else m.assigned[id]=v;if(isExample)leaveExampleSilently();commit()}else render();
});

window.addEventListener("scroll",()=>document.body.classList.toggle("scrolled",window.scrollY>64),{passive:true});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if((VIEWS.some(v=>v[0]===h)||(h==="categories"||h==="pay"))&&h!==view)go(h)});

/* ---------- standalone: backup, storage protection, offline ---------- */
function standaloneInit(){
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
async function saveFile(name,text,type){
  const file=new File([text],name,{type});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true}}
  catch(e){if(e&&e.name==="AbortError")return false}
  const u=URL.createObjectURL(file);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
  return true;
}
/* backups can be locked with a password: PBKDF2 (250k, SHA-256) -> AES-GCM */
const toB64=u=>{let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function encryptText(text,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},await deriveKey(pw,salt),new TextEncoder().encode(text)));return JSON.stringify({clearway:"encrypted-backup",v:1,salt:toB64(salt),iv:toB64(iv),data:toB64(ct)})}
async function decryptText(o,pw){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(o.iv)},await deriveKey(pw,fromB64(o.salt)),fromB64(o.data));return new TextDecoder().decode(pt)}
function exportBackup(){
  openModal(`<h2>Save a backup</h2><p class="muted" style="margin:0">A password locks the file, so anyone who finds it can't read your figures. You'll need it to restore. It can't be recovered.</p>
    <div class="field"><label for="bk-pw">Password (recommended)</label><input id="bk-pw" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div>
    <div class="field"><label for="bk-pw2">Type it again</label><input id="bk-pw2" type="password" autocomplete="new-password"></div>
    <div class="muted" id="bk-err" aria-live="polite"></div>
    <div class="modal-actions"><button class="btn ghost" id="bk-plain">Save without a password</button><button class="btn primary" id="bk-go">Save locked backup</button></div>`,m=>{
    $("#bk-pw").focus();
    const go=async pw=>{
      const name="clearway-backup-"+todayStr()+(pw?"-locked":"")+".json";
      const data=JSON.parse(JSON.stringify(S));data.lastBackup=todayStr();
      let text=JSON.stringify(data,null,1);
      if(pw){try{text=await encryptText(text,pw)}catch(e){$("#bk-err").innerHTML='<span class="owed">This browser can\'t lock files. Save without a password instead.</span>';return}}
      modalClose();
      if(!await saveFile(name,text,"application/json"))return;
      if(isExample)leaveExampleSilently();
      S.lastBackup=todayStr();commit();toast((pw?"Locked backup saved as ":"Backup saved as ")+name);
    };
    $("#bk-go").onclick=()=>{const a=$("#bk-pw").value,b=$("#bk-pw2").value;if(a.length<6){$("#bk-err").innerHTML='<span class="owed">Use at least 6 characters.</span>';return}if(a!==b){$("#bk-err").innerHTML='<span class="owed">The two passwords don\'t match.</span>';return}go(a)};
    $("#bk-plain").onclick=()=>go("");
    m.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("#bk-go").click()}});
  });
}
let pendingRestore=null;
function offerRestore(d){
  const z=$("#restore-zone");
  if(!d||!Array.isArray(d.debts)||!Array.isArray(d.payments)){z.innerHTML='<div class="note"><span class="owed">That file isn\'t a Clearway backup. Choose a file named clearway-backup-….json.</span></div>';return}
  pendingRestore=migrate(d);
  z.innerHTML=`<div class="note" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span>Replace everything on this device with the backup (${d.debts.length} debt${d.debts.length===1?"":"s"}, ${d.payments.length} payment${d.payments.length===1?"":"s"})?</span><button class="btn danger small" data-action="restore-yes">Replace</button><button class="btn ghost small" data-action="restore-no">Cancel</button></div>`;
  z.scrollIntoView({block:"center",behavior:"smooth"});
}
function readBackup(input){
  const f=input.files&&input.files[0];if(!f)return;
  f.text().then(t=>{let d;try{d=JSON.parse(t)}catch(e){d=null}
    if(d&&d.clearway==="encrypted-backup"){
      const z=$("#restore-zone");
      z.innerHTML='<div class="note" style="display:flex;flex-direction:column;gap:8px"><label for="rs-pw"><strong>This backup is locked.</strong> Enter its password.</label><div style="display:flex;gap:8px"><input id="rs-pw" type="password" autocomplete="current-password" style="flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)"><button class="btn primary" id="rs-go">Unlock</button></div><span id="rs-err" class="owed"></span></div>';
      z.scrollIntoView({block:"center",behavior:"smooth"});$("#rs-pw").focus();
      const unlock=async()=>{try{offerRestore(JSON.parse(await decryptText(d,$("#rs-pw").value)))}catch(e){$("#rs-err").textContent="That password didn't open it. Try again."}};
      $("#rs-go").onclick=unlock;$("#rs-pw").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();unlock()}});
      return;
    }
    offerRestore(d);
  });input.value="";
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;
  if(b.dataset.action==="backup-export")exportBackup();
  else if(b.dataset.action==="restore-yes"&&pendingRestore){S=pendingRestore;pendingRestore=null;isExample=false;fmtCache={};commit();toast("Backup restored.")}
  else if(b.dataset.action==="restore-no"){pendingRestore=null;$("#restore-zone").innerHTML=""}});
document.addEventListener("change",e=>{if(e.target.id==="backup-file")readBackup(e.target)});
boot();
})();
